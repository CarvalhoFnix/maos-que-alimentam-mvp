name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx ng build --base-href /maos-que-alimentam-mvp/
      - name: Fallback de rotas (404.html)
        run: cp dist/maos-que-alimentam-mvp/browser/index.html dist/maos-que-alimentam-mvp/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/maos-que-alimentam-mvp/browser
      - id: deployment
        uses: actions/deploy-pages@v4
